[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logsloth"
version = "0.1.0"
description = "Local-first SSH authentication log analyzer powered by open-weight AI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "LogSloth Contributors" },
]
keywords = ["ssh", "security", "log-analysis", "ai", "ollama", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Logging",
]
dependencies = [
    "streamlit>=1.38.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
